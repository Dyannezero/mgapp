<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 예산 현황 및 취합 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; }
        
        /* 로딩 오버레이 스타일 */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 md:p-8 relative">

    <!-- 로딩 오버레이 -->
    <div id="loadingOverlay">
        <div class="spinner mb-4"></div>
        <p class="text-gray-700 font-semibold" id="loadingText">데이터를 불러오는 중입니다...</p>
    </div>

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">📊 팀 예산 관리 시스템</h1>
            <p class="text-gray-500 mt-2">부장님 보고용 일별 예산 취합 및 대시보드</p>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-gray-200 mb-8">
            <button onclick="switchTab('input')" id="tab-input" class="px-6 py-2 font-semibold transition-colors tab-active">데이터 입력</button>
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-6 py-2 font-semibold text-gray-500 hover:text-blue-600 transition-colors">전체 대시보드</button>
        </div>

        <!-- Section 1: Input Form -->
        <div id="section-input" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-1 card p-6">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <span class="mr-2">📝</span> 내역 입력
                </h2>
                <form id="budgetForm" class="space-y-4">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-sm font-medium text-gray-700">팀원 선택</label>
                            <button type="button" onclick="openMemberModal()" class="text-xs text-blue-600 hover:underline">팀원 편집 ⚙️</button>
                        </div>
                        <select id="member" class="block w-full rounded-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500 bg-white" required>
                            <!-- JS Dynamic Content -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">사용 일자</label>
                        <input type="date" id="date" class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">예산 항목</label>
                        <select id="category" class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                            <option value="식비">식비</option>
                            <option value="교통비">교통비</option>
                            <option value="회식비">회식비</option>
                            <option value="사무용품">사무용품</option>
                            <option value="도서/교육비">도서/교육비</option>
                            <option value="복리후생비">복리후생비</option>
                            <option value="수선유지비">수선유지비</option>
                            <option value="비품">비품</option>
                            <option value="개량공사">개량공사</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">사용 금액 (원)</label>
                        <input type="number" id="amount" placeholder="숫자만 입력" class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
                        기록 저장하기
                    </button>
                </form>
            </div>

            <div class="md:col-span-2 card p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">📂 최근 입력 내역</h2>
                    <div class="space-x-2">
                        <button onclick="fetchData()" class="text-xs text-blue-500 hover:underline">새로고침</button>
                        <button onclick="clearData()" class="text-xs text-red-500 hover:underline">모든 데이터 초기화</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">일자</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">팀원</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">항목</th>
                                <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">금액</th>
                                <th class="px-4 py-3"></th>
                            </tr>
                        </thead>
                        <tbody id="historyBody" class="bg-white divide-y divide-gray-200">
                            <!-- JS dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Section 2: Dashboard (Hidden by default) -->
        <div id="section-dashboard" class="hidden space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="card p-6 bg-blue-50">
                    <p class="text-sm text-blue-600 font-semibold">전체 누적 사용액</p>
                    <h3 id="stat-total" class="text-3xl font-bold text-blue-900 mt-1">0원</h3>
                </div>
                <div class="card p-6 bg-green-50">
                    <p class="text-sm text-green-600 font-semibold">전체 최대 사용 항목</p>
                    <h3 id="stat-top-category" class="text-xl font-bold text-green-900 mt-1">-</h3>
                </div>
                <div class="card p-6 bg-purple-50">
                    <p class="text-sm text-purple-600 font-semibold">데이터 건수</p>
                    <h3 id="stat-count" class="text-3xl font-bold text-purple-900 mt-1">0건</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="card p-6">
                    <h2 class="text-lg font-bold mb-4">🏠 항목별 예산 분포</h2>
                    <canvas id="categoryChart"></canvas>
                </div>
                <div class="card p-6">
                    <h2 class="text-lg font-bold mb-4">👥 팀원별 누적 사용액</h2>
                    <canvas id="memberChart"></canvas>
                </div>
            </div>

            <div class="card p-6 overflow-x-auto">
                <h2 class="text-lg font-bold mb-4">📅 일별/항목별 요약 테이블 (취합본)</h2>
                <table id="summaryTable" class="min-w-full border-collapse border border-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <!-- JS dynamic headers -->
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody" class="text-center">
                        <!-- JS dynamic content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="customAlert" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4">
            <h3 class="text-lg font-bold mb-2" id="alertTitle">알림</h3>
            <p id="alertMsg" class="text-gray-600 mb-4"></p>
            <button onclick="closeAlert()" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 transition-colors">확인</button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="customConfirm" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4">
            <h3 class="text-lg font-bold mb-2" id="confirmTitle">확인</h3>
            <p id="confirmMsg" class="text-gray-600 mb-4"></p>
            <div class="flex gap-2">
                <button onclick="closeConfirm(false)" class="w-1/2 bg-gray-300 text-gray-800 py-2 rounded font-bold hover:bg-gray-400 transition-colors">취소</button>
                <button onclick="closeConfirm(true)" class="w-1/2 bg-red-600 text-white py-2 rounded font-bold hover:bg-red-700 transition-colors">확인</button>
            </div>
        </div>
    </div>

    <!-- Member Edit Modal -->
    <div id="memberModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">팀원 편집</h3>
                <button onclick="closeMemberModal()" class="text-gray-500 hover:text-gray-700 text-xl font-bold leading-none">&times;</button>
            </div>
            <div class="flex gap-2 mb-4">
                <input type="text" id="newMemberName" placeholder="새 팀원 이름" class="flex-1 rounded border-gray-300 border p-2 focus:ring-blue-500 focus:border-blue-500" onkeypress="if(event.key==='Enter') addMember()">
                <button onclick="addMember()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700 transition-colors">추가</button>
            </div>
            <ul id="memberList" class="max-h-60 overflow-y-auto space-y-2 mb-4">
                <!-- JS dynamic content -->
            </ul>
            <button onclick="closeMemberModal()" class="w-full bg-gray-200 text-gray-800 py-2 rounded font-bold hover:bg-gray-300 transition-colors">닫기</button>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ 주의: 아래 SCRIPT_URL을 본인의 앱스 스크립트 웹앱 URL로 변경해야 합니다!
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwuPWDlacjIh2mWHgnHDva-49y4VcbVVt8q3Y_JrSJ_uXniKhtT8EfkAyd4hytfeJfM/exec'; 
        
        // State Management
        let budgetData = []; 
        let categoryChart = null;
        let memberChart = null;
        let pendingConfirmCallback = null;

        // 카테고리별 색상 매핑
        const CATEGORY_COLORS = {
            '식비': { bg: 'bg-orange-100', text: 'text-orange-800', hex: '#f97316' },
            '교통비': { bg: 'bg-blue-100', text: 'text-blue-800', hex: '#3b82f6' },
            '회식비': { bg: 'bg-pink-100', text: 'text-pink-800', hex: '#ec4899' },
            '사무용품': { bg: 'bg-yellow-100', text: 'text-yellow-800', hex: '#eab308' },
            '도서/교육비': { bg: 'bg-indigo-100', text: 'text-indigo-800', hex: '#6366f1' },
            '복리후생비': { bg: 'bg-teal-100', text: 'text-teal-800', hex: '#14b8a6' },
            '수선유지비': { bg: 'bg-cyan-100', text: 'text-cyan-800', hex: '#06b6d4' },
            '비품': { bg: 'bg-green-100', text: 'text-green-800', hex: '#10b981' },
            '개량공사': { bg: 'bg-purple-100', text: 'text-purple-800', hex: '#8b5cf6' },
            '기타': { bg: 'bg-gray-100', text: 'text-gray-800', hex: '#64748b' }
        };

        function getCategoryStyle(category) {
            return CATEGORY_COLORS[category] || { bg: 'bg-gray-100', text: 'text-gray-800', hex: '#94a3b8' };
        }

        // 날짜 포맷 함수 (YYYY-MM-DD -> YYYY년 MM월 DD일)
        function formatKoreanDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            return `${parts[0]}년 ${parseInt(parts[1], 10)}월 ${parseInt(parts[2], 10)}일`;
        }

        // 팀원 관리 State (localStorage 사용)
        let teamMembers = JSON.parse(localStorage.getItem('budgetTeamMembers')) || ['부장님', '팀원1', '팀원2'];

        function saveMembers() {
            localStorage.setItem('budgetTeamMembers', JSON.stringify(teamMembers));
            renderMemberSelect();
            if(!document.getElementById('memberModal').classList.contains('hidden')) {
                renderMemberList();
            }
        }

        function renderMemberSelect() {
            const select = document.getElementById('member');
            if(!select) return;
            const currentValue = select.value;
            select.innerHTML = '<option value="">팀원을 선택하세요</option>' + teamMembers.map(m => `<option value="${m}">${m}</option>`).join('');
            if (teamMembers.includes(currentValue)) {
                select.value = currentValue;
            }
        }

        function openMemberModal() {
            document.getElementById('memberModal').classList.remove('hidden');
            renderMemberList();
            setTimeout(() => document.getElementById('newMemberName').focus(), 100);
        }

        function closeMemberModal() {
            document.getElementById('memberModal').classList.add('hidden');
            document.getElementById('newMemberName').value = '';
        }

        function renderMemberList() {
            const list = document.getElementById('memberList');
            list.innerHTML = teamMembers.map(m => `
                <li class="flex justify-between items-center bg-gray-50 p-3 rounded border border-gray-200">
                    <span class="font-medium text-gray-800">${m}</span>
                    <button onclick="removeMember('${m}')" class="text-red-500 hover:text-red-700 text-sm font-semibold">삭제</button>
                </li>
            `).join('');
            
            if(teamMembers.length === 0) {
                list.innerHTML = '<li class="text-center text-gray-500 py-4">등록된 팀원이 없습니다.</li>';
            }
        }

        function addMember() {
            const nameInput = document.getElementById('newMemberName');
            const name = nameInput.value.trim();
            if (!name) {
                showAlert('알림', '팀원 이름을 입력하세요.');
                return;
            }
            if (teamMembers.includes(name)) {
                showAlert('알림', '이미 존재하는 팀원입니다.');
                return;
            }
            teamMembers.push(name);
            nameInput.value = '';
            saveMembers();
        }

        function removeMember(name) {
            showConfirm('팀원 삭제', `'${name}' 팀원을 목록에서 삭제하시겠습니까? (기존 입력된 예산 데이터는 유지됩니다)`, () => {
                teamMembers = teamMembers.filter(m => m !== name);
                saveMembers();
            });
        }

        // UI Helpers
        function showLoading(text = '처리 중...') {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showAlert(title, msg) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('customAlert').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('customAlert').classList.add('hidden');
        }

        function showConfirm(title, msg, callback) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMsg').innerText = msg;
            pendingConfirmCallback = callback;
            document.getElementById('customConfirm').classList.remove('hidden');
        }

        function closeConfirm(result) {
            document.getElementById('customConfirm').classList.add('hidden');
            if (result && pendingConfirmCallback) {
                pendingConfirmCallback();
            }
            pendingConfirmCallback = null;
        }

        // Fetch data from Google Sheets API
        async function fetchData() {
            if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
                showAlert('설정 오류', 'Google Apps Script URL이 설정되지 않았습니다.');
                renderHistory();
                return;
            }

            showLoading('데이터를 불러오는 중입니다...');
            try {
                const response = await fetch(SCRIPT_URL + "?action=read");
                if (!response.ok) throw new Error('Network response was not ok');
                const result = await response.json();
                
                if (result.status === 'success') {
                    // 서버 호환성 유지: date 또는 month 매핑
                    budgetData = result.data.map(row => ({
                        id: row.id || Date.now(),
                        member: row.member,
                        date: row.date || row.month, 
                        category: row.category,
                        amount: parseInt(row.amount)
                    }));
                    renderHistory();
                    if(document.getElementById('section-dashboard').classList.contains('hidden') === false) {
                        updateDashboard();
                    }
                } else {
                    showAlert('오류', '데이터를 불러오는데 실패했습니다: ' + result.message);
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                showAlert('통신 오류', '서버와 통신 중 문제가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        function switchTab(tab) {
            const sections = ['input', 'dashboard'];
            sections.forEach(s => {
                document.getElementById(`section-${s}`).classList.add('hidden');
                document.getElementById(`tab-${s}`).classList.remove('tab-active');
                document.getElementById(`tab-${s}`).classList.add('text-gray-500');
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            document.getElementById(`tab-${tab}`).classList.remove('text-gray-500');

            if(tab === 'dashboard') {
                updateDashboard();
            }
        }

        document.getElementById('budgetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
                showAlert('설정 오류', 'Google Apps Script URL이 설정되지 않았습니다.');
                return;
            }
            
            const newEntry = {
                id: Date.now().toString(),
                member: document.getElementById('member').value,
                date: document.getElementById('date').value,
                category: document.getElementById('category').value,
                amount: document.getElementById('amount').value
            };

            showLoading('데이터를 저장하는 중입니다...');
            
            try {
                const formData = new FormData();
                formData.append('action', 'insert');
                formData.append('id', newEntry.id);
                formData.append('member', newEntry.member);
                formData.append('date', newEntry.date);
                formData.append('month', newEntry.date); // 기존 앱스 스크립트(month 기준) 하위 호환성 유지
                formData.append('category', newEntry.category);
                formData.append('amount', newEntry.amount);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if(result.status === 'success') {
                    newEntry.amount = parseInt(newEntry.amount);
                    budgetData.unshift(newEntry); 
                    
                    // 금액만 초기화하고 이름, 날짜, 카테고리는 유지
                    document.getElementById('amount').value = '';
                    
                    renderHistory();
                    showAlert('성공', '예산 데이터가 성공적으로 저장되었습니다.');
                } else {
                    showAlert('저장 실패', result.message);
                }
            } catch (error) {
                console.error('Error saving data:', error);
                showAlert('통신 오류', '데이터 저장 중 문제가 발생했습니다.');
            } finally {
                hideLoading();
            }
        });

        function deleteEntry(id) {
            showConfirm('항목 삭제', '이 내역을 삭제하시겠습니까?', async () => {
                showLoading('삭제 중...');
                try {
                    const formData = new FormData();
                    formData.append('action', 'delete');
                    formData.append('id', id);

                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();

                    if(result.status === 'success') {
                        budgetData = budgetData.filter(item => item.id.toString() !== id.toString());
                        renderHistory();
                        showAlert('성공', '삭제되었습니다.');
                    } else {
                        showAlert('삭제 실패', result.message);
                    }
                } catch (error) {
                    console.error('Error deleting data:', error);
                    showAlert('통신 오류', '삭제 중 문제가 발생했습니다.');
                } finally {
                    hideLoading();
                }
            });
        }

        function clearData() {
            showConfirm('초기화 주의', '정말로 모든 데이터를 삭제하시겠습니까? (이 작업은 DB에서도 즉시 삭제되며 되돌릴 수 없습니다.)', async () => {
                showLoading('전체 데이터 삭제 중...');
                try {
                    const formData = new FormData();
                    formData.append('action', 'clearAll');

                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();

                    if(result.status === 'success') {
                        budgetData = [];
                        renderHistory();
                        showAlert('성공', '모든 데이터가 초기화되었습니다.');
                    } else {
                        showAlert('초기화 실패', result.message);
                    }
                } catch (error) {
                    console.error('Error clearing data:', error);
                    showAlert('통신 오류', '초기화 중 문제가 발생했습니다.');
                } finally {
                    hideLoading();
                }
            });
        }

        function renderHistory() {
            const body = document.getElementById('historyBody');
            
            // 날짜 최신순 정렬
            const sortedData = [...budgetData].sort((a, b) => new Date(b.date) - new Date(a.date));

            body.innerHTML = sortedData.map(item => {
                const style = getCategoryStyle(item.category);
                return `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 text-sm text-gray-600">${formatKoreanDate(item.date)}</td>
                    <td class="px-4 py-3 text-sm font-semibold text-gray-800">${item.member}</td>
                    <td class="px-4 py-3 text-sm">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${style.bg} ${style.text}">
                            ${item.category}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-sm text-right font-mono">${item.amount.toLocaleString()}원</td>
                    <td class="px-4 py-3 text-right">
                        <button onclick="deleteEntry('${item.id}')" class="text-red-400 hover:text-red-600 transition-colors p-1" title="삭제">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </td>
                </tr>
            `}).join('');
            
            if(sortedData.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="py-10 text-center text-gray-400">등록된 데이터가 없습니다.</td></tr>`;
            }
        }

        // Dashboard Logic
        function updateDashboard() {
            const total = budgetData.reduce((acc, curr) => acc + curr.amount, 0);
            document.getElementById('stat-total').innerText = total.toLocaleString() + '원';
            document.getElementById('stat-count').innerText = budgetData.length + '건';

            // Category aggregation
            const catMap = budgetData.reduce((acc, curr) => {
                acc[curr.category] = (acc[curr.category] || 0) + curr.amount;
                return acc;
            }, {});
            
            const topCategory = Object.keys(catMap).length > 0 ? Object.keys(catMap).reduce((a, b) => catMap[a] > catMap[b] ? a : b, '-') : '-';
            document.getElementById('stat-top-category').innerText = topCategory !== '-' ? `${topCategory} (${catMap[topCategory].toLocaleString()}원)` : '-';

            renderCharts(catMap);
            renderSummaryTable();
        }

        function renderCharts(catMap) {
            const catCtx = document.getElementById('categoryChart').getContext('2d');
            const memCtx = document.getElementById('memberChart').getContext('2d');

            if(categoryChart) categoryChart.destroy();
            if(memberChart) memberChart.destroy();

            const catLabels = Object.keys(catMap);
            const catColors = catLabels.map(cat => getCategoryStyle(cat).hex);

            categoryChart = new Chart(catCtx, {
                type: 'doughnut',
                data: {
                    labels: catLabels,
                    datasets: [{
                        data: Object.values(catMap),
                        backgroundColor: catColors,
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, cutout: '70%' }
            });

            const memMap = budgetData.reduce((acc, curr) => {
                acc[curr.member] = (acc[curr.member] || 0) + curr.amount;
                return acc;
            }, {});

            memberChart = new Chart(memCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(memMap),
                    datasets: [{
                        label: '사용 금액',
                        data: Object.values(memMap),
                        backgroundColor: '#60a5fa',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, grid: { display: true, color: '#f1f5f9' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function renderSummaryTable() {
            const tableHead = document.querySelector('#summaryTable thead tr');
            const tableBody = document.getElementById('summaryTableBody');
            
            // 데이터에 사용된 모든 고유 카테고리 추출
            let usedCategories = [...new Set(budgetData.map(item => item.category))].sort();
            
            // 데이터가 없으면 기본 카테고리 몇 개만 헤더로 표시
            if (usedCategories.length === 0) {
                usedCategories = ['식비', '교통비', '사무용품'];
            }

            // 동적 헤더 생성
            let headHtml = `<th class="border border-gray-200 px-4 py-2">일자</th>`;
            usedCategories.forEach(cat => {
                const style = getCategoryStyle(cat);
                headHtml += `<th class="border border-gray-200 px-4 py-2" style="color: ${style.hex}">${cat}</th>`;
            });
            headHtml += `<th class="border border-gray-200 px-4 py-2 bg-gray-200">합계</th>`;
            tableHead.innerHTML = headHtml;

            // 데이터 일자별 집계
            const dailyData = {};
            budgetData.forEach(item => {
                if(!dailyData[item.date]) {
                    dailyData[item.date] = { total: 0 };
                    usedCategories.forEach(c => dailyData[item.date][c] = 0); // 초기화
                }
                if (dailyData[item.date][item.category] !== undefined) {
                    dailyData[item.date][item.category] += item.amount;
                }
                dailyData[item.date].total += item.amount;
            });

            // 날짜 내림차순 정렬 (최신순)
            const sortedDates = Object.keys(dailyData).sort((a, b) => b.localeCompare(a));

            tableBody.innerHTML = sortedDates.map(date => {
                const row = dailyData[date];
                let rowHtml = `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="border border-gray-200 px-4 py-2 font-semibold text-gray-700 whitespace-nowrap">${formatKoreanDate(date)}</td>`;
                
                usedCategories.forEach(cat => {
                    const val = row[cat] || 0;
                    rowHtml += `<td class="border border-gray-200 px-4 py-2 text-gray-600">${val === 0 ? '-' : val.toLocaleString()}</td>`;
                });

                rowHtml += `<td class="border border-gray-200 px-4 py-2 bg-gray-50 font-bold text-blue-700">${row.total.toLocaleString()}</td>
                    </tr>`;
                return rowHtml;
            }).join('');
            
            if(sortedDates.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="${usedCategories.length + 2}" class="p-4 text-center text-gray-400">데이터가 없습니다.</td></tr>`;
            }
        }

        window.onload = function() {
            // 오늘 날짜로 기본 세팅 (YYYY-MM-DD)
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-CA'); 
            document.getElementById('date').value = dateStr;
            
            // 팀원 목록 초기화
            renderMemberSelect();
            
            // 데이터 불러오기
            fetchData();
        }
    </script>
</body>
</html>
